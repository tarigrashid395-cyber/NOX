name: NOX Production Validation

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Show Repository Files
        run: |
          pwd
          ls -la
          find . -maxdepth 2 -type f | head -100

      - name: Validate Workflow
        run: |
          echo "NOX validation workflow running successfully"
